    steps:
      - name: Supabase anfragen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://qpmnraeacexzjnnlvqhw.supabase.co/rest/v1/rpc/znacht_load" \
            -H "apikey: sb_publishable_BvKAH1kJTAZJSiwyIXAeJQ_YJ6_KATy" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"WACH-HALT-EN00-0000-0000"}')
          echo "Antwort von Supabase: $code"
          if [ "$code" != "200" ]; then exit 1; fi
